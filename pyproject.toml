[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataprepkit"
version = "0.1.0"
description = "Dataset preparation, validation, cleaning, and reporting toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.scripts]
dataprep = "dataprepkit.cli:main"
